name: self hosted
on:
    pull_request:
        branches:
            - main
            - master
    push:
        branches:
            - main
            - master
    workflow_dispatch:

jobs:
    self_hosted_runner:
        runs-on: [self-hosted , kiran-vm]  # [providing its label to identify ]
        #by default every self hosted runne rgets label slef-hosted you can more labels
        #even one label matched our github will assignto taht runner (slef hosetd label is common)
        #so you can remove and add only specific label
        steps:
            - name: printing my full name
              run: echo "mandapati venkata sai kiran"
    

#you must setup runner with that lable name kiran-vm
#go to settings of repo --> action--> runner --> new self hosted runner
# and run the given configurations
#see by deafult you can us eslef-hosted but see you can explicitly specify set of labels
#instead of only runs-on:[self-hosted]
#if you give extra labels
#runs-on:[self-hosted , lables] 



