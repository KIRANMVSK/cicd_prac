#lets dive into this two important github actions concepst
#  - oidc
#  - environments
name : oidc and environments practice
on:
    pull_request:
        branches:
            - main
            - master
    push:
        branches:
            - main
            - master
    workflow_dispatch:
jobs:
    tf_plan:
        runs-on: ubuntu-latest
        environment: production

        #lets try to print the eenvironment secrets and variabels
        #and see i also slected required reviewers so adter reviewer allow only
        #pipeline runs and we allowed to access the prodution env secrets and vars
        steps:

            - name: printing variable
              run: echo "${{secrets.USER_NAME}}"
            
            - name: printing secrets
              run: echo "${{vars.PASSWORD}}"
    
    aws-authentication:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: arn:aws:iam::560696397575:role/EC2-ROLE-GITHUB
            aws-region: us-east-1

        - name: Verify AWS Identity
          run: aws sts get-caller-identity

        - name: List EC2 Instances
          run: aws ec2 describe-instances


        
