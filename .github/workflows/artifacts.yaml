#GitHub Actions artifacts are stored in a dedicated cloud storage space provided by GitHub.
name: artifacts usage
on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master
    workflow_dispatch:

env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_DEFAULT_REGION: us-east-1
defaults:
    run:
        working-directory: ./terraform_code

jobs:
    tf_plan:
        runs-on: ubuntu-latest
        steps:
            - name: github checkout
              uses: actions/checkout@v4

            - name: terraform installation
              uses: hashicorp/setup-terraform@v3

            - name: terraform init
              run: terraform init

            - name: terraform validate
              run: terraform validate

            - name: terraform plan
              run: terraform plan -out tfplan

            - name: Upload Plan Artifact
              uses: actions/upload-artifact@v4
              with:
                name: tfplan
                path: ./terraform_code/tfplan
             
      
    #as we know each job starts with fresh new vm
    #and each step inside the job gets new shell 
    #inside the job the data processed will be persistent inside the workspace across steps          
    tf_apply:
        runs-on: ubuntu-latest
        needs: tf_plan
        steps:
            #again we need to do checkout the github the code else it does stores inside default runner workspace
            # /home/runner/work/

            - name: github checkout
              uses: actions/checkout@v4
            #it clones the github code and makes the github dir as the default working dir
            #now deafault workspace will be --> /home/runner/work/<repo>/<repo>
            #first repo simply github repo name to store any temp came while cloning
            #second repo is actual our github repo now it will be deafult workspace dir
            #and it is for all steps inside this job

            #we can change if we want while running shell using run 
            #on while using uses we can use with and change dir location as our preference

            - name: Download Plan Artifact
              uses: actions/download-artifact@v4   # downloads artifact into the current root dir/workspace
              with:
                name: tfplan  # the name(nothing but label) we given at the time of  uploading artifact

            - name: terraform installation
              uses: hashicorp/setup-terraform@v3
            
            - name: terraform init
              run: terraform init

            - name: terraform apply
              run: terraform apply -auto-approve tfplan

              #in deafults we mentioned working-directory as ./terraform_code while running any run command

