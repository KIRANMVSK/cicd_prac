
# 1. Workflow name
name: CI Pipeline

# 2. Workflow triggers
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# 3. Jobs
jobs:

  # Job name
  build:

    # 4. Runner environment
    runs-on: ubuntu-latest

    # 5. Steps
    steps:

      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Execute shell command
      - name: Check Python Version
        run: python --version

      # Install dependencies
      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Execute tests
      - name: Run Tests
        run: pytest





